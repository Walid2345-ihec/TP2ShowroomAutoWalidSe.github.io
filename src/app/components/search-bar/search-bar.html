<div class="header">
    <label>Brand</label>
    <input type="text" #brand 
    (input)="selectAutos(brand.value)">
    <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
</div>
<div class="container">
    @for(auto of selectedAutos;track auto.id){
        <div class="auto-card">
            <img [src]="`photos/${auto.photo}`">
            <div class="details">
                <h3>{{auto.brand}} {{auto.model}}</h3>
            <p>
                Power: {{auto.power}}<br>
                Price: {{auto.price}} DNT<br>
                Only {{auto.availability}} units in stock<br>
            </p>
            </div>
        <div class="see-more">
            <button (click)="selectCar(auto)">See More...</button>
        </div>
        </div>
    }
</div>
